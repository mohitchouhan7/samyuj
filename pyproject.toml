[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samyuj"
version = "1.0.0"
description = "Native Linux desktop companion for Smart Connect / Ready For Android phones"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["smart-connect", "ready-for", "android", "linux", "gtk", "webrtc", "nfs", "webcam", "interoperability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "cryptography>=41.0.0",
    "Pillow>=10.0.0",
    "segno>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/samyuj/samyuj"
Repository = "https://github.com/samyuj/samyuj"
Issues = "https://github.com/samyuj/samyuj/issues"

[project.optional-dependencies]
media = [
    "aiortc>=1.6.0",
    "av>=11.0.0",
    "mss>=9.0.0",
]
ble = [
    "bleak>=0.21.0",
]
dev = [
    "pytest>=7.4.0",
    "aiortc>=1.6.0",
    "av>=11.0.0",
    "mss>=9.0.0",
    "bleak>=0.21.0",
]

[project.scripts]
samyuj = "samyuj.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
